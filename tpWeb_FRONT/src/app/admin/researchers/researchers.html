<h2>Researchers CRUD</h2>
 <!-- TEST -->
<p style="color:red">
  TEST COMPONENT LOADED
</p>

<p>COUNT: {{ researchers?.length }}</p>
<!-- SEARCH -->
<input [(ngModel)]="searchText" placeholder="Search by name">
<button (click)="search()">Search</button>
<button (click)="load()">Reset</button>

<hr>

<!-- FORM -->
<input [(ngModel)]="form.nom" placeholder="Nom">
<input [(ngModel)]="form.prenom" placeholder="Prenom">
<input [(ngModel)]="form.email" placeholder="Email">
<input [(ngModel)]="form.biographie" placeholder="Biographie">

<br><br>

<button *ngIf="selectedId === null" (click)="add()">Add</button>
<button *ngIf="selectedId !== null" (click)="update()">Update</button>
<button (click)="reset()">Cancel</button>

<hr>

<!-- TABLE -->
<table border="1">
  <tr>
    <th>ID</th>
    <th>Nom</th>
    <th>Prenom</th>
    <th>Email</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let r of researchers">
    <td>{{ r.id }}</td>
    <td>{{ r.nom }}</td>
    <td>{{ r.prenom }}</td>
    <td>{{ r.email }}</td>
    <td>
      <button (click)="edit(r)">Edit</button>
      <button (click)="delete(r.id)">Delete</button>
    </td>
  </tr>
</table>
